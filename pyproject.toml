[project]
name = "jetstream-lakehouse"
version = "0.1.0"
description = "Destination-independent Jetstream v2 archive and live client"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jetstream Lakehouse contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "cbor2>=5.6,<6",
  "requests>=2.32,<3",
  "websockets>=15,<16",
  "xxhash>=3.4,<4",
  "zstandard>=0.22,<1",
]

[project.urls]
Repository = "https://github.com/jesinity/jetstream-lakehouse"
Issues = "https://github.com/jesinity/jetstream-lakehouse/issues"
Documentation = "https://github.com/jesinity/jetstream-lakehouse#readme"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jetstream_lakehouse"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/RELEASING.md", "/LICENSE", "/NOTICE", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
